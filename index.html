d over the remaining vesting period was recognised immediately, and nothing is charged thereafter.`);const w=i.map(u=>`${u.reportingDate}: ${u.expectedInstrumentsTotal.display} instruments expected, cumulative £${u.cumulativeCharge.rounded}, period £${u.periodCharge.rounded}`).join("; ");v.push(`Schedule: ${w}.`);const S=i.filter(u=>u.marketConditionOutcome==="FAILED");if(S.length>0&&v.push(`The market condition was recorded as FAILED at ${S[S.length-1].reportingDate}. No reversal has been made: market conditions are reflected in the grant-date fair value and are never trued up, so the cumulative charge of £${h.cumulativeCharge.rounded} stands for the ${h.expectedInstrumentsTotal.display} instruments that satisfied the service and non-market conditions (IFRS 2 para 21; FRS 102 s.26 equivalent).`),c)if(c.schedule&&c.totals){const u=c.schedule[c.schedule.length-1];v.push(`Employer's NIC: scheme type ${c.assessment.schemeType} — the engine derived that employer's (secondary Class 1) NIC applies`+(c.assessment.rcaBasis==="ASSUMED"?" (resting on the flagged assumption that the shares are readily convertible assets)":c.assessment.rcaBasis==="CONFIRMED_BY_USER"?" (RCA status confirmed by the user)":"")+`. The provision is remeasured at each reporting date to the current share price; at ${u.reportingDate} it stands at £${u.provision.rounded}`+(u.releasedOnCancellation?" (released on cancellation)":"")+". The full derivation is in the NIC assessment.")}else v.push(`Employer's NIC: none recognised. ${c.assessment.reasoning[0]??""}`+(c.assessment.jointElection&&c.assessment.schemeType==="UNAPPROVED"?" (Employer NIC transferred to employees by joint election.)":""));if(d&&e.deferredTax){const u=d.schedule[d.schedule.length-1],p=e.deferredTax.recoverability;v.push(`Deferred tax: the future deduction is estimated from period-end intrinsic value, not the accounting charge. At ${u.reportingDate} the recognised deferred tax asset is £${u.dtaRecognised.rounded}`+(u.releasedOnCancella `)}const Oe={volatility:{input:"volatility",label:"Expected volatility (σ)",whatItIs:"The annualised standard deviation of the continuously compounded returns expected on the underlying share over the expected life of the option.",whyItMatters:"After the share price itself, volatility is the most sensitive Black-Scholes input: higher volatility means more option value and a higher charge. For a private company it cannot be observed, so it is pure judgement — which is exactly why it needs a documented methodology, not a single figure.",approaches:[{name:"Comparable listed companies",description:"Select a basket (typically 4–8) of listed companies comparable by sector, size, growth stage and leverage; measure each one's historical volatility over a period equal to the expected life, ending at the grant date; take the median or interquartile range. Define the selection criteria before looking at the resulting volatilities.",evidenceToRetain:"The comparator list with selection criteria, the data source and extraction date, the measurement period and frequency (daily/weekly), and the calculation itself."},{name:"Sector index proxy",description:"Volatility of a relevant sector index (e.g. a FTSE sector index) as a floor or cross-check. An index diversifies away company-specific movement, so index volatility systematically UNDERSTATES single-company volatility — if used as the primary basis, justify why, or apply and document an uplift.",evidenceToRetain:"Index chosen and why, period measured, and the reasoning for any uplift."},{name:"Implied volatility of comparators",description:"Where comparable listed companies have traded options, their implied volatility is forward-looking evidence that can corroborate a historical estimate.",evidenceToRetain:"Quote source, dates, and tenor of the options observed."},{name:"Consistency with EMI/HMRC valuation work",description:"Where an EMI valuation was agreed with HMRC near the grant date, the assumptions used there are persuasive ription:"A valuation agreed with HMRC (e.g. via a VAL231 submission) close to the grant date is strong contemporaneous evidence. It is agreed for tax purposes, not accounting — note that EMI valuations often reflect minority/marketability discounts that need revisiting for a fair-value measure — but auditors give it real weight.",evidenceToRetain:"The valuation report and HMRC agreement letter, plus a note of any accounting adjustments."},{name:"Income or market approach",description:"A DCF or comparable-company-multiples valuation, ideally cross-checked one against the other, where no transaction evidence exists.",evidenceToRetain:"The full valuation model, key assumptions, and the cross-check."}],auditorFocus:["Proximity of the evidence to the grant date (a round nine months earlier in a moving market is weak).","The reasoning for any discount from a preference-share price to the ordinary-share value.","Consistency with every other fair-value exercise the company has run near the same date."],pitfalls:["Using nominal (par) value — it is not fair value.","Ignoring the preference stack and treating the headline round price as the ordinary-share value."]},exercisePrice:{input:"exercisePrice",label:"Exercise price (K)",whatItIs:"The strike price per option, from the option agreement or scheme rules.",whyItMatters:"Fixes the intrinsic value at grant and, with S, whether the award is at, in or out of the money. It is contractual rather than judgemental — but it must match the signed documents.",approaches:[{name:"Read it off the agreement",description:"Take the strike from the executed option agreement. For nil-cost options the model value tends to the share price less expected dividends; model with a nominal strike and document the choice, or supply the fair value directly.",evidenceToRetain:"The executed option agreements or scheme rules."}],auditorFocus:["The model input agrees to the signed documents.","Nil-cost awards handled and documented deliberately."],pitfalls:["Using an intended strike from a board paper that differs from the executed agreement."]},riskFreeRate:{input:"riskFreeRate",label:"Risk-free rate (r)",whatItIs:"The yield on a UK government instrument (gilt) with a remaining term matching the expected life, observed at the grant date. The engine expects the rate CONTINUOUSLY COMPOUNDED: convert an annually compounded gilt yield with r = ln(1 + r_annual).",whyItMatters:"A modest sensitivity, but a mechanical one — and an easy win for an auditor if the rate is from the wrong date, the wrong maturity, or the wrong instrument.",approaches:[{name:"Gilt yield at grant date",description:"Take the gilt yield (Bank of England or DMO published curves) for the maturity closest to the expected life, on the grant date, and convert to continuous compounding.",evidenceToRetain:"A dated extract of the curve/yield and the compounding conversion."}],auditorFocus:["Grant-date observation, not the date the accounts were prepared.","Maturity matches the expected life.","The compounding conversion is shown."],pitfalls:["Using the company's borrowing rate.","Using today's rate for last year's grant."],links:[{label:"Bank of England — British Government Securities yields",url:"https://www.bankofengland.co.uk/boeapps/database/index.asp?Travel=NIxIRx&levels=1&XNotes=Y&A4062XBMX4051X4052X4053.x=6&A4062XBMX4051X4052X4053.y=2&XNotes2=Y&Nodes=X4051X4052X4053X4058&SectionRequired=I&HideNums=-1&ExtraInfo=true#BM",checkedOn:"2026-09-11",note:"Gilt yields at 5, 10 and 20-year maturities, available daily as well as monthly and annually. Take the maturity closest to your expected life — a 6.5-year expected life is nearer the 5 or 10-year series than the 20-year — read the rate at the GRANT date, and convert it to continuous compounding before entering it here.",findItAgain:'Search the Bank of England statistical database for "British Government Securities" yields, under Interest & exchange rates.'}]},dividendYield:{input:"dividendYield",label:"Expected dividend yield (q)",whatItIs:"The dividend yield expected on the underlying share over the expected life. Option holders do not receive dividends, so expected dividends reduce a call's value.",whyItMatters:"For most UK SMEs with option schemes the honest answer is zero — but zero must be an ASSERTION, not a default. The engine deliberately refuses to assume it: you must pass an explicit 0 and be able to stand behind it.",approaches:[{name:"Zero, positively asserted",description:"Confirm against distribution history and shareholder/board intentions that no dividends are expected over the expected life, and record that confirmation.",evidenceToRetain:"A note referencing distribution history and board intentions."},{name:"Forecast yield",description:"Where the company pays or plans dividends, derive an expected yield from the distribution policy relative to the grant-date share value.",evidenceToRetain:"The dividend policy or forecast and the yield derivation."}],auditorFocus:["Consistency with dividends actually paid before and after grant, and with board minutes."],pitfalls:["Passing zero out of habit while the company pays regular dividends."]},expectedVesting:{input:"expectedVesting",label:"Instruments expected to satisfy service and non-market conditions",whatItIs:"At each reporting date, the number of instruments now expected to meet the SERVICE and NON-MARKET performance conditions. Re-estimated every period; at vesting it becomes the actual outcome. Deliberately defined to EXCLUDE market-condition expectations.",whyItMatters:"This estimate is the entire true-up mechanism, and it is one-sided by design: leavers and missed internal targets flow through it (and can produce a credit), but a market condition (TSR, share-price target) must never be folded in — that risk is already priced into the grant-date fair value and is never trued up.",approaches:[{name:"Turnover-based forfeiture estimate",description:"Apply historical staff-turnover rates for the grantee population over the remaining vesting period, refined by scheme-specific leaver history as it accumulates.",evidenceToRetain:"The turnover data, the population it covers, and the projection."},{name:"Non-market target reforecast",description:"For non-market performance conditions (EBITDA, revenue, non-financial milestones), align the vesting expectation with the company's own current forecast of the target.",evidenceToRetain:"The forecast relied on and its date."}],auditorFocus:["Back-testing: how previous estimates compared with actual vesting.","Symmetry: estimates revised up as readily as down.","That market conditions were NOT folded into this figure."],pitfalls:["Reversing charge because a TSR or share-price target failed — prohibited; the charge stands if service was rendered.","Leaving the estimate at 100% for years and taking one large credit at vesting."]},suppliedFairValue:{input:"suppliedFairValue",label:"Supplied grant-date fair value per instrument",whatItIs:"A fair value per instrument produced outside the engine — required for any grant carrying a market condition (where the valuation, e.g. Monte Carlo, must price the market condition into the grant-date fair value), and available for externally valued awards generally.",whyItMatters:"Once supplied, this value is fixed: it is never remeasured, and for market-condition awards it already embeds the probability of the market condition failing. That is exactly why a failed market condition triggers no reversal.",approaches:[{name:"Monte Carlo valuation (market conditions)",description:"A simulation of the share price (and any comparator index) over the vesting period, valuing the award only in paths where the market condition is met. The discount versus an unconditioned value is the price of the market condition.",evidenceToRetain:"The valuation report: model, number of paths, input assumptions (which should be consistent with the judgements documented for the other inputs), and who performed it."}],auditorFocus:["Competence and objectivity of whoever produced the value.","Input assumptions consistent with the company's other judgements (volatility, expected life...).","The market condition is genuinely priced in — not applied as a crude haircut."],pitfalls:["Valuing a market-condition award with plain Black-Scholes — the engine refuses this combination."]},schemeType:{input:"schemeType",label:"Scheme type (EMI / CSOP / unapproved)",whatItIs:`The tax scheme the option was granted under. You report the fact; the ENGINE derives whether employer's (secondary Class 1) NIC applies and writes its reasoning into the basis — you do not set "NIC applies" directly.`,whyItMatters:"It determines whether an employer's NIC provision exists at all. The derivation: EMI and CSOP are tax-advantaged, so on a qualifying exercise no employer's NIC arises — the engine defaults NIC off and says why. Unapproved options attract employer's NIC where the shares are readily convertible assets (RCAs) — usually true where a sale or listing is in prospect, so the engine defaults NIC on for unapproved awards, resting on a stated RCA assumption you can override to off with a rationale. Separately, a joint election transferring the employer's NIC to employees suppresses the provision whatever the scheme type.",approaches:[{name:"Evidence the scheme status",description:"Hold the scheme documentation: for EMI, the option agreements and the notification to HMRC (required within the statutory window) plus the agreed valuation; for CSOP, the scheme registration and rules; for unapproved awards, the option agreements. The scheme type in the engine should be traceable to these documents, not to recollection.",evidenceToRetain:"Option agreements, HMRC notifications/registrations, and the EMI valuation agreement."},{name:"Confirm the RCA position (unapproved awards)",description:"Shares are readily convertible assets where trading arrangements exist or are likely to come into existence — an imminent sale or listing usually makes them RCAs at exercise. Confirm or override the engine's assumption based on the realistic exit picture at the expected exercise date, and record the reasoning either way.",evidenceToRetain:"A note of the RCA analysis: trading arrangements, exit prospects, and the conclusion."},{name:"Check for joint elections",description:"Where employees have signed a joint election transferring the employer's NIC to them, no employer provision arises. Report it on the NIC input; the engine records the election and suppresses the provision.",evidenceToRetain:"The signed election forms (HMRC-approved form) and board approval."}],auditorFocus:["EMI qualification MAINTAINED: disqualifying events (working-time, independence, trade changes) can silently convert an EMI grant into an unapproved one.","EMI granted at or above the HMRC-agreed market value — a discounted grant creates tax and NIC on the discount.","The RCA analysis for unapproved awards, especially where NIC has been switched off.","Election documents where the provision is suppressed by transfer."],pitfalls:["Assuming EMI status without checking for disqualifying events since grant.","Treating the RCA question as static — shares that are not RCAs today usually are at an exit.","Turning NIC off without a documented rationale (the engine warns)."]},nicRate:{input:"nicRate",label:"Employer's NIC rate",whatItIs:"The employer's (secondary Class 1) National Insurance rate expected to apply to the option gain when the liability crystallises at exercise, entered as a decimal (15% → 0.15).",whyItMatters:"It scales the whole provision, and the provision is remeasured to the share price each period, so a wrong rate is a systematic error that grows with the share price. The rate to use is the one expected at exercise — normally the current enacted rate plus any enacted future changes.",approaches:[{name:"Enacted rate at the reporting date",description:"Take the secondary Class 1 percentage from the HMRC rate tables in force at the reporting date, and adjust only for changes that are enacted to take effect before the expected exercise date. Do not anticipate announced-but-unenacted changes.",evidenceToRetain:"A dated extract of the HMRC rate table and a note of any enacted future change applied."}],auditorFocus:["The rate agrees to the HMRC table at the reporting date, including any enacted change effective before expected exercise.","Consistency between the rate's effective date and the expected exercise horizon used elsewhere."],pitfalls:["Entering a percentage instead of a decimal — the engine rejects rates of 1 or more.","Missing enacted rate changes or supplementary levies applying at the expected exercise date."]},taxRate:{input:"taxRate",label:"Tax rate for the deferred tax asset",whatItIs:"The corporation tax rate at which the future share-scheme deduction is expected to reverse — the rate enacted or substantively enacted at the reporting date for the period in which exercise is expected. Entered as a decimal (25% → 0.25).",whyItMatters:"It converts the estimated deduction into the deferred tax asset and drives both the P&L and equity credits. Using the wrong period's rate, or an announced-but-not-substantively-enacted rate, misstates the asset.",approaches:[{name:"Enacted or substantively enacted rate for the expected reversal period",description:"Identify when exercise (and so the deduction) is expected, then apply the CT rate enacted or substantively enacted at the reporting date for that period. For a UK SME, consider whether the small profits rate, main rate or marginal relief band is the realistic rate at reversal, and document the choice.",evidenceToRetain:"The Finance Act reference (or substantive-enactment date) and the band analysis."}],auditorFocus:["Substantive enactment at the reporting date, evidenced, not an announced intention.","The band (small profits vs main rate vs marginal relief) matches the profit forecasts used for recoverability.","Consistency with the tax rate used for other deferred tax balances."],pitfalls:["Using the rate at grant rather than the rate expected at reversal.","A main-rate DTA sitting alongside small-company profit forecasts that would attract a lower rate."]},periodEndSharePrice:{input:"periodEndSharePrice",label:"Share price at each reporting date",whatItIs:"The fair value of one underlying ordinary share at EACH reporting date. For a private company this is itself a valuation judgement every period — there is no observable price, so the number must be produced and supported afresh at each reporting date, not rolled forward.",whyItMatters:"It drives everything that is remeasured: the employer's NIC provision and the estimated future tax deduction (and so the deferred tax asset and its equity/P&L split) all move with it, unlike the share-based payment charge, which stays fixed at the grant-date fair value. An unsupported period-end price contaminates every remeasured figure at once.",approaches:[{name:"Consistent methodology, refreshed each period",description:"Apply the same valuation approach used for the grant-date share price (funding-round evidence adjusted for rights, DCF or multiples), updated for the period's trading and any new transaction evidence. Consistency of method period to period is what makes the movement in the provision and DTA meaningful.",evidenceToRetain:"The valuation working for each reporting date and a bridge explaining the movement from the prior period."},{name:"Transaction evidence near the period end",description:"A funding round, secondary sale or EMI valuation agreed near the reporting date is strong evidence, with the same class-rights adjustments as at grant.",evidenceToRetain:"The transaction terms and the adjustment reasoning."}],auditorFocus:["A fresh, dated valuation at each reporting date — not last year's figure carried forward.","Methodology consistency with the grant-date valuation and period on period.","A narrative for large movements (they
